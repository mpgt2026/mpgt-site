<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">


<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Manila Pampanga Go Taxi</title>
<meta name="description" content="Admin dashboard.">
<meta name="theme-color" content="#102A43">
<link rel="icon" type="image/png" href="/assets/69fafbe15d88b8ca53de7f08169a767b.png">
<meta name="robots" content="noindex, nofollow">
<script src="/dc.js"></script>
<script src="/i18n.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8;font-family:'Inter',system-ui,sans-serif;color:#102A43}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #C9A66B;outline-offset:2px}
.fld{box-sizing:border-box;width:100%;min-height:44px;padding:0 12px;border:1px solid #D8CFBA;border-radius:2px;background:#FBF8F1;font:inherit;font-size:14px;color:#102A43}
.lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#4A5D70}
.side-btn{transition:background-color .2s ease,color .2s ease}
.side-btn:hover{background:rgba(201,166,107,.16)}
.row-btn{transition:background-color .2s ease}
.row-btn:hover{background:#FBF8F1}
.amt{font-family:'Inter',system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum";letter-spacing:-.01em}
.amt-lg{font-family:'Inter',system-ui,sans-serif;font-weight:300;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum";letter-spacing:-.035em;color:#102A43}
.lg-field{display:flex;align-items:center;gap:14px;height:54px;padding:0 22px;border-radius:999px;background:#0A1B2D;box-shadow:inset 5px 5px 12px rgba(0,0,0,.6),inset -4px -4px 10px rgba(255,255,255,.04);color:#C9A66B;cursor:text}
.lg-field:focus-within{box-shadow:inset 5px 5px 12px rgba(0,0,0,.6),inset -4px -4px 10px rgba(255,255,255,.04),0 0 0 2px #C9A66B}
.lg-in{flex:1;min-width:0;border:0;background:transparent;outline:0 !important;font:inherit;font-size:16px;color:#F5F1E8}
.lg-in::placeholder{color:#7F93A8}
.lg-btn{min-height:46px;padding:0 16px;border-radius:6px;border:1px solid rgba(255,255,255,.06);background:#1B3A5C;color:#F5F1E8;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.lg-btn:hover{background:#244A73;transform:translateY(-1px)}
.cal-day{min-height:112px;box-sizing:border-box;padding:6px;border-top:1px solid #E3DCCB;border-left:1px solid #E3DCCB;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-chip{display:block;width:100%;box-sizing:border-box;padding:4px 7px;border:0;border-radius:2px;font:inherit;font-size:11.5px;font-weight:600;line-height:1.3;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip:hover{filter:brightness(1.15)}
.tile{transition:transform .25s ease,box-shadow .25s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,42,67,.12)}

a[style*="background:#C9A66B"],button[style*="background:#C9A66B"],a[style*="background:#102A43"],button[style*="background:#102A43"]{position:relative;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.45) !important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
a[style*="background:#C9A66B"],button[style*="background:#C9A66B"]{background:linear-gradient(180deg,#E6CC96 0%,#C9A66B 52%,#B58F52 100%) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -10px 18px rgba(143,107,46,.28),0 8px 20px rgba(201,166,107,.38),0 2px 4px rgba(16,42,67,.18)}
a[style*="background:#102A43"],button[style*="background:#102A43"]{background:linear-gradient(180deg,#2B4D72 0%,#102A43 55%,#0B1F33 100%) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -10px 18px rgba(0,0,0,.3),0 8px 20px rgba(16,42,67,.32),0 2px 4px rgba(16,42,67,.2)}
a[style*="background:#C9A66B"]::before,button[style*="background:#C9A66B"]::before,a[style*="background:#102A43"]::before,button[style*="background:#102A43"]::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:52%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08));border-radius:inherit;pointer-events:none}
a[style*="background:#C9A66B"]::after,button[style*="background:#C9A66B"]::after,a[style*="background:#102A43"]::after,button[style*="background:#102A43"]::after{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s ease;pointer-events:none}
a[style*="background:#C9A66B"]:hover::after,button[style*="background:#C9A66B"]:hover::after,a[style*="background:#102A43"]:hover::after,button[style*="background:#102A43"]:hover::after{left:130%}
a[style*="background:#C9A66B"]:hover,button[style*="background:#C9A66B"]:hover,a[style*="background:#102A43"]:hover,button[style*="background:#102A43"]:hover{transform:translateY(-2px);filter:brightness(1.05)}
@media (prefers-reduced-motion:reduce){.tile,.side-btn,.row-btn{transition:none}.tile:hover{transform:none}}
</style>
</helmet>

<template data-sc="if" value="{{ notAuthed }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:40px 16px;background:radial-gradient(ellipse at 50% 0%,#17324D 0%,#0B1F33 62%)">
  <form onSubmit="{{ login }}" aria-label="Admin sign in" style="width:100%;max-width:400px;box-sizing:border-box;padding:36px 36px 32px;border-radius:28px;border:1px solid rgba(201,166,107,.5);background:linear-gradient(160deg,#133250,#0D2338);box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column;gap:16px">
    <div style="align-self:center;background:#F5F1E8;border-radius:2px;padding:8px 16px"><img src="/assets/69fafbe15d88b8ca53de7f08169a767b.png" alt="Manila Pampanga Go Taxi" style="display:block;height:44px;width:auto"></div>
    <h1 style="margin:8px 0 14px;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:40px;line-height:1;color:#F5F1E8">Login</h1>
    <label class="lg-field"><span aria-hidden="true" style="font-size:20px;font-weight:600;width:22px;text-align:center">@</span><input class="lg-in" type="text" placeholder="Username" aria-label="Username" autocomplete="username" value="{{ loginUser }}" onChange="{{ setLoginUser }}"></label>
    <label class="lg-field"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V7Z"/></svg><input class="lg-in" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" value="{{ loginPass }}" onChange="{{ setLoginPass }}"></label>
    <template data-sc="if" value="{{ loginErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin:0;font-size:13.5px;line-height:1.5;color:#F2A9A3">{{ loginErr }}</p></template>
    <template data-sc="if" value="{{ loginInfo }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin:0;font-size:13.5px;line-height:1.5;color:#E6CC96">{{ loginInfo }}</p></template>
    <div style="display:flex;gap:12px;margin-top:14px">
      <button type="button" onClick="{{ login }}" style="flex:1;min-height:46px;padding:0 16px;border-radius:6px;background:#C9A66B;color:#102A43;font:inherit;font-size:15px;font-weight:700;cursor:pointer">Login</button>
      <button type="button" class="lg-btn" onClick="{{ showSignup }}" style="flex:1">Sign Up</button>
    </div>
    <button type="button" class="lg-btn" onClick="{{ showForgot }}">Forgot Password</button>
  </form>
</div>
</template>

<template data-sc="if" value="{{ isAuthed }}" hint-placeholder-val="{{ true }}">
<div style="width:100%;max-width:1440px;margin:0 auto;background:#F5F1E8;overflow:clip;display:flex;flex-wrap:wrap;align-items:stretch;min-height:900px">

  <!-- SIDEBAR -->
  <aside style="flex:0 0 250px;min-width:220px;background:#0B1F33;color:#F5F1E8;display:flex;flex-direction:column;gap:28px;padding:28px 20px;box-sizing:border-box">
    <div style="background:#F5F1E8;border-radius:2px;padding:10px 14px;display:flex;justify-content:center"><img src="/assets/69fafbe15d88b8ca53de7f08169a767b.png" alt="Manila Pampanga Go Taxi" style="height:48px;width:auto;max-width:100%"></div>
    <div>
      <p style="margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#C9A66B">Admin</p>
      <nav aria-label="Admin sections" style="display:flex;flex-direction:column;gap:4px">
        <template data-sc="for" list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <button type="button" class="side-btn" onClick="{{ t.pick }}" aria-current="{{ t.on }}" style="{{ t.style }}">
            <span style="{{ t.badgeStyle }}">{{ t.count }}</span>
            <span style="flex:1;text-align:left">{{ t.label }}</span>
          </button>
        </template>
      </nav>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
      <a href="/" style="font-size:13px;color:#CFC7B6;letter-spacing:.04em">&larr; View website</a>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#9FB0C2">Test mode: what you change here is saved in this browser and shows on the website.</p>
      <button type="button" onClick="{{ signOut }}" style="min-height:40px;padding:0 14px;border-radius:2px;border:1px solid rgba(201,166,107,.6);background:transparent;color:#E6CC96;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">Sign out</button>
      <button type="button" onClick="{{ resetData }}" style="min-height:40px;padding:0 14px;border-radius:2px;border:1px solid rgba(245,241,232,.35);background:transparent;color:#F5F1E8;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">Reset test data</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main style="flex:1 1 640px;min-width:0;padding:32px 40px 64px;box-sizing:border-box">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid #C9A66B;padding-bottom:20px">
      <div>
        <p style="margin:0;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#8F6B2E">{{ eyebrow }}</p>
        <h1 style="margin:6px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:46px;line-height:1.05">{{ heading }}</h1>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><p style="margin:0;font-size:13px;color:#4A5D70">{{ todayLabel }}</p><button type="button" onClick="{{ checkInbox }}" style="min-height:36px;padding:0 14px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">Check for new requests</button></div>
    </div>
    <template data-sc="if" value="{{ hasFlash }}" hint-placeholder-val="{{ false }}"><div role="status" style="margin-top:16px;padding:12px 16px;background:#E7F1EA;border-left:3px solid #2F7D4F;border-radius:2px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between"><span>{{ flashText }}</span><button type="button" onClick="{{ clearFlash }}" style="min-height:34px;padding:0 14px;border:1px solid #2F7D4F;border-radius:2px;background:transparent;color:#1F5A38;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">Dismiss</button></div></template>
    <template data-sc="if" value="{{ saveWarn }}" hint-placeholder-val="{{ false }}"><div role="alert" style="margin-top:16px;padding:12px 16px;background:#F6E3E1;border-left:3px solid #8A1F18;border-radius:2px;font-size:14px;color:#8A1F18">Your latest changes could not be saved in this browser (storage is full or blocked). Try a smaller photo, or delete unused photos.</div></template>

    <!-- ============ BOOKINGS ============ -->
    <template data-sc="if" value="{{ isBookings }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Booking requests" style="margin-top:24px">
        <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px">
          <template data-sc="for" list="{{ stats }}" as="s" hint-placeholder-count="4">
            <li class="tile" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:2px solid #C9A66B;border-radius:4px;padding:16px 18px">
              <p class="lbl" style="margin:0">{{ s.label }}</p>
              <p class="amt-lg" style="margin:8px 0 0">{{ s.value }}</p>
            </li>
          </template>
        </ul>

        <div role="group" aria-label="Filter by status" style="margin-top:24px;display:flex;flex-wrap:wrap;gap:8px">
          <template data-sc="for" list="{{ filters }}" as="f" hint-placeholder-count="6">
            <button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}" style="{{ f.style }}">{{ f.label }}</button>
          </template>
        </div>

        <template data-sc="if" value="{{ noRows }}" hint-placeholder-val="{{ false }}">
          <p style="margin:24px 0 0;padding:32px;text-align:center;background:#FFFFFF;border:1px dashed #D8CFBA;border-radius:4px;color:#4A5D70">No requests with this status.</p>
        </template>

        <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
          <template data-sc="for" list="{{ rows }}" as="b" hint-placeholder-count="3">
            <article style="{{ b.cardStyle }}">
              <button type="button" class="row-btn" onClick="{{ b.toggle }}" aria-expanded="{{ b.isOpen }}" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;width:100%;box-sizing:border-box;padding:16px 20px;background:transparent;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer">
                <span style="flex:0 0 96px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#8F6B2E">{{ b.ref }}</span>
                <span style="flex:1 1 200px;min-width:0"><span style="display:block;font-weight:600;font-size:15px">{{ b.name }}</span><span style="display:block;margin-top:2px;font-size:13px;color:#4A5D70">{{ b.route }}</span></span>
                <span style="flex:1 1 150px;min-width:0"><span style="display:block;font-size:14px">{{ b.when }}</span><span style="display:block;margin-top:2px;font-size:13px;color:#4A5D70">{{ b.vehicle }} &middot; {{ b.pax }} pax</span></span>
                <span style="flex:0 0 130px;text-align:right"><span class="amt" style="display:block;font-size:16px">{{ b.quoteText }}</span><span style="display:block;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.02em;color:#8F6B2E">{{ b.payChip }}</span></span>
                <span style="{{ b.badgeStyle }}">{{ b.statusLabel }}</span>
              </button>
              <template data-sc="if" value="{{ b.isOpen }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-wrap:wrap;gap:24px 40px;padding:20px 20px 24px;border-top:1px solid #E3DCCB;background:#FBF8F1">
                  <dl style="flex:1 1 280px;min-width:0;margin:0;display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:14px">
                    <dt class="lbl">Client</dt><dd style="margin:0">{{ b.name }}</dd>
                    <dt class="lbl">Trip type</dt><dd style="margin:0">{{ b.trip }}</dd>
                    <dt class="lbl">Route</dt><dd style="margin:0">{{ b.route }}</dd>
                    <dt class="lbl">Pickup</dt><dd style="margin:0">{{ b.when }}</dd>
                    <dt class="lbl">Passengers</dt><dd style="margin:0">{{ b.pax }}</dd>
                    <dt class="lbl">Requested</dt><dd style="margin:0">{{ b.vehicle }}</dd>
                    <dt class="lbl">Pay by</dt><dd style="margin:0">{{ b.payPref }}</dd>
                    <dt class="lbl">Payment</dt><dd style="margin:0">{{ b.payState }}</dd>
                    <template data-sc="if" value="{{ b.rebooked }}" hint-placeholder-val="{{ false }}"><dt class="lbl">Rebooked</dt><dd style="margin:0">From {{ b.origWhen }}</dd></template>
                    <dt class="lbl">Notes</dt><dd style="margin:0;color:#2B3F55">{{ b.notes }}</dd>
                  </dl>
                  <div style="flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px">
                    <template data-sc="if" value="{{ b.isRejected }}" hint-placeholder-val="{{ false }}">
                      <div style="padding:14px 16px;background:#F6E3E1;border-left:3px solid #8A1F18;border-radius:2px;display:flex;flex-direction:column;gap:8px">
                        <p class="lbl" style="margin:0;color:#8A1F18">Rejected: {{ b.rejectReason }}</p>
                        <template data-sc="if" value="{{ b.hasRejectNote }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:14px;line-height:1.55">{{ b.rejectNote }}</p></template>
                        <p style="margin:0;font-size:13px;line-height:1.55;color:#4A5D70">{{ b.rebookInfo }}</p>
                        <template data-sc="if" value="{{ b.hasRebookUrl }}" hint-placeholder-val="{{ false }}">
                          <p style="margin:0;padding:10px 12px;background:#FFFFFF;border:1px solid #E3B8B3;border-radius:2px;font-size:13px;overflow-wrap:anywhere;user-select:all">{{ b.rebookUrl }}</p>
                          <div><button type="button" onClick="{{ b.copyRebook }}" style="min-height:40px;padding:0 16px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">{{ b.copyRebookLabel }}</button></div>
                        </template>
                      </div>
                    </template>
                    <template data-sc="if" value="{{ b.isRebooking }}" hint-placeholder-val="{{ false }}">
                      <div style="padding:14px 16px;background:#E7F1EA;border-left:3px solid #2F7D4F;border-radius:2px;display:flex;flex-direction:column;gap:6px">
                        <p class="lbl" style="margin:0;color:#1F5A38">Client rebooking request</p>
                        <p class="amt" style="margin:0;font-size:18px">{{ b.rebookWhen }}</p>
                        <p style="margin:0;font-size:13px;line-height:1.55;color:#2B3F55">Original date: {{ b.origWhen }}. Payment is already received. The booking ID stays {{ b.ref }}.</p>
                        <template data-sc="if" value="{{ b.hasRebookNote }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:13.5px;line-height:1.5">Client note: {{ b.rebookNote }}</p></template>
                      </div>
                    </template>

                    <div style="display:flex;flex-direction:column;gap:12px">
                      <template data-sc="if" value="{{ b.showQuote }}" hint-placeholder-val="{{ true }}">
                        <div style="max-width:220px;display:flex;flex-direction:column;gap:6px">
                          <label class="lbl" for="{{ b.quoteId }}">Quote (PHP)</label>
                          <input class="fld amt" id="{{ b.quoteId }}" type="number" min="0" step="50" placeholder="0" value="{{ b.quote }}" onChange="{{ b.setQuote }}" style="font-size:16px">
                        </div>
                      </template>
                      <template data-sc="if" value="{{ b.hasActions }}" hint-placeholder-val="{{ true }}">
                        <div style="display:flex;flex-direction:column;gap:8px">
                          <p class="lbl" style="margin:0">Actions</p>
                          <div style="display:flex;flex-wrap:wrap;gap:8px">
                            <template data-sc="for" list="{{ b.actions }}" as="a" hint-placeholder-count="3"><button type="button" onClick="{{ a.pick }}" style="{{ a.style }}">{{ a.label }}</button></template>
                          </div>
                          <template data-sc="if" value="{{ b.hasErr }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin:0;font-size:13.5px;color:#B3261E">{{ b.errText }}</p></template>
                          <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px">
                            <template data-sc="for" list="{{ b.hints }}" as="h" hint-placeholder-count="3"><li style="font-size:12.5px;line-height:1.5;color:#4A5D70"><strong style="color:#102A43">{{ h.label }}:</strong> {{ h.text }}</li></template>
                          </ul>
                        </div>
                      </template>
                    </div>

                    <template data-sc="if" value="{{ b.rejecting }}" hint-placeholder-val="{{ false }}">
                      <div style="padding:16px;border:1px solid #E3B8B3;border-radius:4px;background:#FFFFFF;display:flex;flex-direction:column;gap:12px">
                        <p class="lbl" style="margin:0;color:#8A1F18">Reject this request</p>
                        <div style="display:flex;flex-direction:column;gap:6px">
                          <label class="lbl" for="{{ b.rejId }}">Reason</label>
                          <select class="fld" id="{{ b.rejId }}" value="{{ b.rejReason }}" onChange="{{ b.setRejReason }}">
                            <template data-sc="for" list="{{ b.rejOpts }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></template>
                          </select>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:6px">
                          <label class="lbl" for="{{ b.rejNoteId }}">Note to the client</label>
                          <textarea class="fld" id="{{ b.rejNoteId }}" rows="3" placeholder="{{ b.rejPlaceholder }}" value="{{ b.rejNoteVal }}" onChange="{{ b.setRejNote }}" style="padding:10px 12px;min-height:80px;resize:vertical"></textarea>
                        </div>
                        <p style="margin:0;font-size:12.5px;line-height:1.5;color:#4A5D70">{{ b.rejHint }}</p>
                        <div style="display:flex;flex-wrap:wrap;gap:8px">
                          <button type="button" onClick="{{ b.submitReject }}" style="min-height:44px;padding:0 22px;border-radius:2px;border:0;background:#8A1F18;color:#FFFFFF;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer">Reject and prepare message</button>
                          <button type="button" onClick="{{ b.cancelReject }}" style="min-height:44px;padding:0 20px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer">Cancel</button>
                        </div>
                      </div>
                    </template>

                    <template data-sc="if" value="{{ b.hasLink }}" hint-placeholder-val="{{ false }}">
                      <div style="padding:16px;border:1px solid #E3DCCB;border-radius:4px;background:#FFFFFF;display:flex;flex-direction:column;gap:12px">
                        <p class="lbl" style="margin:0">Card payment link (Visa or Mastercard)</p>
                        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px"><span style="{{ b.linkBadge }}">{{ b.linkLabel }}</span><span style="font-size:13px;color:#4A5D70">{{ b.linkExpiry }}</span></div>
                        <template data-sc="if" value="{{ b.linkIsActive }}" hint-placeholder-val="{{ false }}">
                          <p style="margin:0;padding:10px 12px;background:#FBF8F1;border:1px solid #E3DCCB;border-radius:2px;font-size:13px;overflow-wrap:anywhere;user-select:all">{{ b.linkUrl }}</p>
                          <div style="display:flex;flex-wrap:wrap;gap:8px">
                            <button type="button" onClick="{{ b.copyLink }}" style="min-height:40px;padding:0 16px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">{{ b.copyLinkLabel }}</button>
                            <button type="button" onClick="{{ b.cancelLink }}" style="min-height:40px;padding:0 16px;border-radius:2px;border:1px solid #E3C2BE;background:#FFFFFF;color:#8A1F18;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">Cancel link</button>
                          </div>
                        </template>
                      </div>
                    </template>

                    <div>
                      <p class="lbl" style="margin:0 0 8px">Message to client</p>
                      <p style="margin:0 0 10px;padding:12px 14px;background:#FFFFFF;border:1px solid #E3DCCB;border-left:3px solid #C9A66B;border-radius:2px;font-size:13.5px;line-height:1.6;color:#2B3F55;white-space:pre-wrap;overflow-wrap:anywhere">{{ b.msgText }}</p>
                      <template data-sc="if" value="{{ b.noChannels }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:14px;color:#4A5D70">The client did not leave a WhatsApp number, Kakao ID or email.</p></template>
                      <div style="display:flex;flex-direction:column;gap:8px">
                        <template data-sc="for" list="{{ b.channels }}" as="c" hint-placeholder-count="2">
                          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:#FFFFFF;border:1px solid #E3DCCB;border-radius:2px">
                            <span style="flex:0 0 72px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8F6B2E">{{ c.label }}</span>
                            <span style="flex:1 1 140px;min-width:0;font-size:14px;overflow-wrap:anywhere">{{ c.value }}</span>
                            <template data-sc="if" value="{{ c.isLink }}" hint-placeholder-val="{{ true }}">
                              <a href="{{ c.href }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;justify-content:center;min-height:40px;box-sizing:border-box;padding:0 18px;border-radius:2px;background:#C9A66B;color:#102A43;font-weight:600;font-size:12.5px">{{ c.action }}</a>
                            </template>
                            <button type="button" onClick="{{ c.copy }}" style="{{ c.copyStyle }}">{{ c.copyLabel }}</button>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </article>
          </template>
        </div>
      </section>
    </template>

    <!-- ============ CALENDAR ============ -->
    <template data-sc="if" value="{{ isCalendar }}" hint-placeholder-val="{{ false }}">
      <section aria-label="Booking calendar" style="margin-top:24px">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
            <button type="button" onClick="{{ calPrev }}" aria-label="Previous month" style="min-height:44px;min-width:44px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:18px;cursor:pointer">&larr;</button>
            <h2 style="margin:0;min-width:220px;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:32px">{{ calTitle }}</h2>
            <button type="button" onClick="{{ calNext }}" aria-label="Next month" style="min-height:44px;min-width:44px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:18px;cursor:pointer">&rarr;</button>
            <button type="button" onClick="{{ calToday }}" style="min-height:44px;padding:0 18px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Today</button>
          </div>
          <p style="margin:0;font-size:13.5px;color:#4A5D70">{{ calSummary }}</p>
        </div>
        <p style="margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:#4A5D70"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#17324D;margin-right:6px"></span>Confirmed</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#D9D2C0;margin-right:6px"></span>Completed</span><span>The calendar updates when you confirm a booking.</span></p>
        <div style="margin-top:14px;background:#FFFFFF;border:1px solid #E3DCCB;border-radius:4px;overflow-x:auto">
          <div style="min-width:760px">
            <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#102A43;color:#F5F1E8;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase">
              <template data-sc="for" list="{{ calHead }}" as="h" hint-placeholder-count="7"><span style="padding:12px 8px;text-align:center">{{ h }}</span></template>
            </div>
            <template data-sc="for" list="{{ calWeeks }}" as="w" hint-placeholder-count="5">
              <div style="display:grid;grid-template-columns:repeat(7,1fr)">
                <template data-sc="for" list="{{ w.days }}" as="d" hint-placeholder-count="7">
                  <div class="cal-day" style="{{ d.cellStyle }}">
                    <button type="button" onClick="{{ d.pick }}" aria-label="{{ d.aria }}" style="{{ d.numStyle }}">{{ d.num }}</button>
                    <template data-sc="for" list="{{ d.chips }}" as="c" hint-placeholder-count="0"><button type="button" class="cal-chip" onClick="{{ c.pick }}" title="{{ c.title }}" style="{{ c.style }}">{{ c.label }}</button></template>
                    <template data-sc="if" value="{{ d.hasMore }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ d.pick }}" style="border:0;background:transparent;padding:2px 4px;font:inherit;font-size:11.5px;font-weight:600;color:#8F6B2E;text-align:left;cursor:pointer">{{ d.more }}</button></template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <h3 style="margin:28px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px">{{ selTitle }}</h3>
        <template data-sc="if" value="{{ selEmpty }}" hint-placeholder-val="{{ false }}"><p style="margin:12px 0 0;padding:24px;text-align:center;background:#FFFFFF;border:1px dashed #D8CFBA;border-radius:4px;color:#4A5D70">No confirmed trips on this day.</p></template>
        <ul style="list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px">
          <template data-sc="for" list="{{ selRows }}" as="r" hint-placeholder-count="2">
            <li style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 18px;background:#FFFFFF;border:1px solid #E3DCCB;border-radius:4px">
              <span class="amt" style="flex:0 0 84px;font-size:15px">{{ r.time }}</span>
              <span style="flex:1 1 220px;min-width:0"><span style="display:block;font-weight:600;font-size:15px">{{ r.name }}</span><span style="display:block;margin-top:2px;font-size:13px;color:#4A5D70">{{ r.route }}</span></span>
              <span style="flex:1 1 150px;min-width:0;font-size:13px;color:#4A5D70">{{ r.vehicle }} &middot; {{ r.pax }} pax</span>
              <span class="amt" style="flex:0 0 100px;font-size:15px;text-align:right">{{ r.amount }}</span>
              <button type="button" onClick="{{ r.open }}" style="min-height:40px;padding:0 16px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer">Open booking</button>
            </li>
          </template>
        </ul>
      </section>
    </template>

    <!-- ============ RATES ============ -->
    <template data-sc="if" value="{{ isRates }}" hint-placeholder-val="{{ false }}">
      <section aria-label="Rates and pricing" style="margin-top:24px">
        <p style="margin:0;padding:14px 18px;background:#F1E6CF;border-left:3px solid #C9A66B;border-radius:2px;font-size:14px;line-height:1.55;color:#5A4515">Sample figures only. Replace them with your actual rates. Changes save automatically in this browser. The row named &ldquo;Pampanga to Metro Manila&rdquo; sets the fixed fares on the booking form.</p>

        <div style="margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px">Route rates (PHP)</h2>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
            <span style="font-size:13px;color:#4A5D70">{{ rateStatus }}</span>
            <button type="button" onClick="{{ addRate }}" style="min-height:44px;padding:0 20px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-weight:600;cursor:pointer">Add route</button>
            <button type="button" onClick="{{ saveRates }}" style="min-height:44px;padding:0 24px;border-radius:2px;background:#C9A66B;color:#102A43;font:inherit;font-weight:600;cursor:pointer">Save rates</button>
          </div>
        </div>

        <div style="margin-top:16px;background:#FFFFFF;border:1px solid #E3DCCB;border-radius:4px;overflow-x:auto">
          <div style="min-width:720px">
            <div style="display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 60px;gap:12px;padding:14px 20px;background:#102A43;color:#F5F1E8;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase">
              <span>Route</span><span>Sedan</span><span>MPV / SUV / AUV</span><span>Van</span><span></span>
            </div>
            <template data-sc="for" list="{{ rates }}" as="r" hint-placeholder-count="4">
              <div style="display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 60px;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid #E3DCCB">
                <input class="fld" type="text" aria-label="Route name" value="{{ r.name }}" onChange="{{ r.setName }}">
                <input class="fld" type="number" min="0" step="50" aria-label="Sedan rate" value="{{ r.sedan }}" onChange="{{ r.setSedan }}">
                <input class="fld" type="number" min="0" step="50" aria-label="MPV, SUV or AUV rate" value="{{ r.mpv }}" onChange="{{ r.setMpv }}">
                <input class="fld" type="number" min="0" step="50" aria-label="Van rate" value="{{ r.van }}" onChange="{{ r.setVan }}">
                <button type="button" onClick="{{ r.remove }}" aria-label="Remove route" style="min-height:44px;border:0;border-radius:2px;background:transparent;color:#8A1F18;font:inherit;font-size:20px;cursor:pointer">&times;</button>
              </div>
            </template>
          </div>
        </div>

        <div style="margin-top:36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px">Extras &amp; fees</h2>
          <button type="button" onClick="{{ addExtra }}" style="min-height:44px;padding:0 20px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-weight:600;cursor:pointer">Add extra</button>
        </div>
        <div style="margin-top:16px;background:#FFFFFF;border:1px solid #E3DCCB;border-radius:4px;overflow-x:auto">
          <div style="min-width:560px">
            <template data-sc="for" list="{{ extras }}" as="x" hint-placeholder-count="4">
              <div style="display:grid;grid-template-columns:2.2fr 1fr 1.4fr 60px;gap:12px;align-items:center;padding:12px 20px;border-top:1px solid #E3DCCB">
                <input class="fld" type="text" aria-label="Fee name" value="{{ x.name }}" onChange="{{ x.setName }}">
                <input class="fld" type="number" min="0" step="50" aria-label="Amount" value="{{ x.amount }}" onChange="{{ x.setAmount }}">
                <input class="fld" type="text" aria-label="Unit" value="{{ x.unit }}" onChange="{{ x.setUnit }}">
                <button type="button" onClick="{{ x.remove }}" aria-label="Remove extra" style="min-height:44px;border:0;border-radius:2px;background:transparent;color:#8A1F18;font:inherit;font-size:20px;cursor:pointer">&times;</button>
              </div>
            </template>
          </div>
        </div>
      </section>
    </template>

    <!-- ============ FLEET ============ -->
    <template data-sc="if" value="{{ isFleet }}" hint-placeholder-val="{{ false }}">
      <section aria-label="Vehicles" style="margin-top:24px">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
          <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px">Vehicles</h2>
          <button type="button" onClick="{{ startAdd }}" style="min-height:44px;padding:0 24px;border-radius:2px;background:#C9A66B;color:#102A43;font:inherit;font-weight:600;cursor:pointer">Add vehicle</button>
        </div>

        <template data-sc="if" value="{{ showForm }}" hint-placeholder-val="{{ false }}">
          <form onSubmit="{{ saveVehicle }}" style="margin-top:16px;padding:24px;background:#FFFFFF;border:1px solid #C9A66B;border-top:2px solid #C9A66B;border-radius:4px;display:flex;flex-wrap:wrap;gap:24px 32px">
            <div style="flex:0 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px">
              <p class="lbl" style="margin:0">Photo</p>
              <div style="aspect-ratio:16/10;background:#FBF8F1;border:1px dashed #D8CFBA;border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden">
                <template data-sc="if" value="{{ form.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ form.img }}" alt="Vehicle photo preview" style="width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box"></template>
                <template data-sc="if" value="{{ form.noImg }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;color:#4A5D70;padding:12px;text-align:center">No photo yet</span></template>
              </div>
              <label for="veh-photo" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid #D8CFBA;border-radius:2px;background:#FFFFFF;font-size:13px;font-weight:600;cursor:pointer">Upload photo</label>
              <input id="veh-photo" type="file" accept="image/*" onChange="{{ pickPhoto }}" style="font-size:12px">
              <p style="margin:0;font-size:12px;color:#4A5D70">A clear side or three-quarter view on a white background works best.</p>
            </div>
            <div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:14px">
              <h3 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px">{{ formTitle }}</h3>
              <div style="display:flex;flex-direction:column;gap:6px">
                <label class="lbl" for="veh-name">Vehicle name</label>
                <input class="fld" id="veh-name" type="text" placeholder="e.g. Toyota Innova" value="{{ form.name }}" onChange="{{ setFormName }}" aria-invalid="{{ form.invName }}">
                <template data-sc="if" value="{{ form.invName }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:13px;color:#B3261E">Enter the vehicle name.</p></template>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:12px">
                <div style="flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:6px">
                  <label class="lbl" for="veh-cat">Category</label>
                  <select class="fld" id="veh-cat" value="{{ form.cat }}" onChange="{{ setFormCat }}">
                    <option value="Sedan">Sedan</option><option value="MPV / SUV / AUV">MPV / SUV / AUV</option><option value="Van">Van</option>
                  </select>
                </div>
                <div style="flex:1 1 110px;min-width:0;display:flex;flex-direction:column;gap:6px">
                  <label class="lbl" for="veh-seats">Passengers</label>
                  <input class="fld" id="veh-seats" type="number" min="1" placeholder="4" value="{{ form.seats }}" onChange="{{ setFormSeats }}">
                </div>
                <div style="flex:1 1 110px;min-width:0;display:flex;flex-direction:column;gap:6px">
                  <label class="lbl" for="veh-bags">Luggage</label>
                  <input class="fld" id="veh-bags" type="number" min="0" placeholder="2" value="{{ form.bags }}" onChange="{{ setFormBags }}">
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <label class="lbl" for="veh-desc">Details</label>
                <textarea class="fld" id="veh-desc" rows="3" placeholder="Air-conditioned, comfortable for city and out-of-town trips." value="{{ form.desc }}" onChange="{{ setFormDesc }}" style="padding:10px 12px;min-height:84px;resize:vertical"></textarea>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">
                <button type="button" onClick="{{ saveVehicle }}" style="min-height:44px;padding:0 26px;border-radius:2px;background:#102A43;color:#F5F1E8;font:inherit;font-weight:600;cursor:pointer">{{ formSaveLabel }}</button>
                <button type="button" onClick="{{ cancelForm }}" style="min-height:44px;padding:0 22px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-weight:600;cursor:pointer">Cancel</button>
              </div>
            </div>
          </form>
        </template>

        <template data-sc="if" value="{{ noVehicles }}" hint-placeholder-val="{{ false }}">
          <p style="margin:16px 0 0;padding:32px;text-align:center;background:#FFFFFF;border:1px dashed #D8CFBA;border-radius:4px;color:#4A5D70">No vehicles yet. Use Add vehicle to upload your first one.</p>
        </template>

        <ul style="list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px">
          <template data-sc="for" list="{{ vehicles }}" as="v" hint-placeholder-count="6">
            <li class="tile" style="background:#FFFFFF;border:1px solid #E3DCCB;border-radius:4px;overflow:hidden;display:flex;flex-direction:column">
              <div style="aspect-ratio:16/10;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><img src="{{ v.img }}" alt="{{ v.name }}" style="width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box"></div>
              <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid #E3DCCB;flex:1">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;line-height:1.15">{{ v.name }}</span><span class="lbl">{{ v.cat }}</span></div>
                <p style="margin:0;font-size:13px;font-weight:600;color:#8F6B2E">{{ v.facts }}</p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#4A5D70">{{ v.desc }}</p>
                <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
                  <label class="lbl" for="{{ v.statusId }}">Status</label>
                  <select class="fld" id="{{ v.statusId }}" value="{{ v.status }}" onChange="{{ v.setStatus }}" style="{{ v.statusStyle }}">
                    <option value="Available">Available</option><option value="On trip">On trip</option><option value="Maintenance">Maintenance</option>
                  </select>
                </div>
                <template data-sc="if" value="{{ v.confirming }}" hint-placeholder-val="{{ false }}">
                  <div style="padding:12px;background:#F6E3E1;border-radius:2px;display:flex;flex-direction:column;gap:10px">
                    <p style="margin:0;font-size:13px;color:#8A1F18">Delete {{ v.name }}? This removes its photo and details.</p>
                    <div style="display:flex;gap:8px">
                      <button type="button" onClick="{{ v.confirmDelete }}" style="min-height:40px;padding:0 18px;border-radius:2px;border:0;background:#8A1F18;color:#FFFFFF;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Yes, delete</button>
                      <button type="button" onClick="{{ v.cancelDelete }}" style="min-height:40px;padding:0 18px;border-radius:2px;border:1px solid #D8CFBA;background:#FFFFFF;color:#102A43;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Keep</button>
                    </div>
                  </div>
                </template>
                <template data-sc="if" value="{{ v.notConfirming }}" hint-placeholder-val="{{ true }}">
                  <div style="display:flex;gap:8px">
                    <button type="button" onClick="{{ v.edit }}" style="flex:1;min-height:40px;border-radius:2px;background:#102A43;color:#F5F1E8;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Edit</button>
                    <button type="button" onClick="{{ v.askDelete }}" style="flex:1;min-height:40px;border-radius:2px;border:1px solid #E3B8B3;background:#FFFFFF;color:#8A1F18;font:inherit;font-size:13px;font-weight:600;cursor:pointer">Delete</button>
                  </div>
                </template>
              </div>
            </li>
          </template>
        </ul>

      </section>
    </template>

    <!-- ============ REVIEWS ============ -->
    <template data-sc="if" value="{{ isReviews }}" hint-placeholder-val="{{ false }}">
      <section aria-label="Guest reviews" style="margin-top:24px">
        <p style="margin:0 0 16px;font-size:14px;color:#4A5D70;line-height:1.55">New reviews from the website wait here. Approve a review to show it on the Home page and include it in the average rating. Only approved reviews count.</p>
        <ul style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px">
          <template data-sc="for" list="{{ rvStats }}" as="x" hint-placeholder-count="4">
            <li style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:2px solid #C9A66B;border-radius:4px;padding:16px 18px"><p class="lbl" style="margin:0">{{ x.label }}</p><p class="amt-lg" style="margin:8px 0 0">{{ x.value }}</p></li>

const dim = new Date(cy, cmo, 0).getDate();
const weeksN = Math.ceil((startOff + dim) / 7);
const dayStr = (y, m, d) => { const t = new Date(y, m - 1, d); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); };
const calBk = all.filter((b) => b.status === 'confirmed' || b.status === 'completed');
const byDate = {};
calBk.forEach((b) => { (byDate[b.date] = byDate[b.date] || []).push(b); });
Object.keys(byDate).forEach((k) => byDate[k].sort((x, y) => (x.time || '').localeCompare(y.time || '')));
const selDate = s.calSel || todayStr;
const openBk = (b) => this.setState({ tab: 'bookings', filter: 'all', open: b.id, rej: null, err: null });
const calWeeks = [];
for (let w = 0; w < weeksN; w++) {
const days = [];
for (let d = 0; d < 7; d++) {
const idx = w * 7 + d - startOff + 1;
const inMonth = idx >= 1 && idx <= dim;
const ds = dayStr(cy, cmo, idx);
const list = inMonth ? (byDate[ds] || []) : [];
const isToday = ds === todayStr, isSel = ds === selDate;
const num = new Date(cy, cmo - 1, idx).getDate();
days.push({
num, aria: new Date(cy, cmo - 1, idx).toDateString() + (list.length ? ', ' + list.length + (list.length === 1 ? ' trip' : ' trips') : ''),
cellStyle: 'background:' + (!inMonth ? '#F5F1E8' : isSel ? '#FBF3E1' : '#FFFFFF') + (isSel ? ';box-shadow:inset 0 0 0 2px #C9A66B' : '') + (d === 6 ? ';border-right:1px solid #E3DCCB' : ''),
numStyle: 'align-self:flex-start;min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:0;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:' + (isToday ? '#C9A66B' : 'transparent') + ';color:' + (isToday ? '#102A43' : inMonth ? '#102A43' : '#A9B3BE'),
chips: list.slice(0, 3).map((b) => ({ label: fmtTime(b.time).replace(' ', '').toLowerCase() + ' ' + b.name, title: b.name + ' - ' + b.route, style: b.status === 'completed' ? 'background:#E8E2D2;color:#4A5D70' : 'background:#17324D;color:#F3E3BE', pick: () => this.setState({ calSel: ds }) })),
hasMore: list.length > 3, more: '+' + (list.length - 3) + ' more',
pick: () => this.setState({ calSel: inMonth ? ds : ds, calMonth: inMonth ? s.calMonth : ds.slice(0, 7) })
});
}
calWeeks.push({ days });
}
const monthKey = s.calMonth || todayStr.slice(0, 7);
const monthBk = calBk.filter((b) => b.date.slice(0, 7) === monthKey && b.status === 'confirmed');
const monthVal = monthBk.reduce((a, b) => a + (Number(b.quote) || 0), 0);
let calTitle = monthKey;
try { calTitle = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); } catch (err) {}
const shiftMonth = (n) => { const t = new Date(cy, cmo - 1 + n, 1); this.setState({ calMonth: t.getFullYear() + '-' + pad(t.getMonth() + 1) }); };
let selTitle = selDate;
try { const q = selDate.split('-'); selTitle = new Date(Number(q[0]), Number(q[1]) - 1, Number(q[2])).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); } catch (err) {}
const selRows = (byDate[selDate] || []).map((b) => ({ time: fmtTime(b.time), name: b.name, route: b.route, vehicle: b.vehicle, pax: b.pax, amount: peso(b.quote), open: () => openBk(b) }));


// ----- destinations -----
const ROUTE_PAGES = [['/routes/pampanga-to-metro-manila', 'Pampanga & Metro Manila'], ['/routes/naia-clark-airport-transfer', 'NAIA and Clark Airport'], ['/routes/manila-to-baguio', 'Manila to Baguio'], ['/routes/manila-to-tagaytay', 'Manila to Tagaytay'], ['/routes/manila-to-batangas', 'Manila to Batangas City'], ['/routes/pampanga-to-tagaytay', 'Pampanga to Tagaytay'], ['/routes/manila-to-clark-airport', 'Manila to Clark Airport'], ['/routes/naia-to-pampanga', 'NAIA to Pampanga'], ['/routes/manila-to-la-union', 'Manila to La Union'], ['/routes/manila-to-laguna', 'Manila to Laguna'], ['/routes/manila-to-cavite', 'Manila to Cavite'], ['/routes/manila-to-zambales', 'Manila to Zambales'], ['/routes/manila-to-pangasinan', 'Manila to Pangasinan'], ['/routes/manila-to-dingalan', 'Manila to Dingalan'], ['/book', 'Booking page']];
const destPageOpts = ROUTE_PAGES.map((r) => ({ v: r[0], label: r[1] }));
const pageLabel = (pg) => { const f = ROUTE_PAGES.find((r) => r[0] === pg); return f ? f[1] : pg; };
const dform = s.destForm || {};
const destForm = Object.assign({}, dform, { hasImg: !!dform.img, noImg: !dform.img, invName: !!dform.invName });
const setD = (k) => (ev) => this.setState({ destForm: Object.assign({}, this.state.destForm, { [k]: ev.target.value, invName: k === 'name' ? false : this.state.destForm.invName }) });
const moveDest = (id, dir) => { const a = this.state.destinations.slice(); const i = a.findIndex((x) => x.id === id); const j = i + dir; if (i < 0 || j < 0 || j >= a.length) return; const t = a[i]; a[i] = a[j]; a[j] = t; this.setState({ destinations: a }); };
const dests = s.destinations.map((d, i) => ({
...d,
pageLabel: pageLabel(d.page),
confirming: s.destConfirm === d.id, notConfirming: s.destConfirm !== d.id,
canUp: i > 0, canDown: i < s.destinations.length - 1,
up: () => moveDest(d.id, -1), down: () => moveDest(d.id, 1),
edit: () => { this.setState({ destEditing: d.id, destForm: { name: d.name, page: d.page, img: d.img }, destConfirm: '' }); setTimeout(() => { try { document.getElementById('dest-name').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (err) {} }, 60); },
askDelete: () => this.setState({ destConfirm: d.id }),
cancelDelete: () => this.setState({ destConfirm: '' }),
confirmDelete: () => this.setState({ destinations: this.state.destinations.filter((x) => x.id !== d.id), destConfirm: '', destEditing: this.state.destEditing === d.id ? '' : this.state.destEditing })
}));

// ----- rates -----
const rates = s.rates.map((r) => ({
...r,
setName: (ev) => updRate('rates', r.id, { name: ev.target.value }),
setSedan: (ev) => updRate('rates', r.id, { sedan: ev.target.value }),
setMpv: (ev) => updRate('rates', r.id, { mpv: ev.target.value }),
setVan: (ev) => updRate('rates', r.id, { van: ev.target.value }),
remove: () => this.setState({ rates: this.state.rates.filter((x) => x.id !== r.id), rateDirty: true, rateSaved: '' })
}));
const extras = s.extras.map((x) => ({
...x,
setName: (ev) => updRate('extras', x.id, { name: ev.target.value }),
setAmount: (ev) => updRate('extras', x.id, { amount: ev.target.value }),
setUnit: (ev) => updRate('extras', x.id, { unit: ev.target.value }),
remove: () => this.setState({ extras: this.state.extras.filter((y) => y.id !== x.id), rateDirty: true, rateSaved: '' })
}));

// ----- fleet -----
const statusStyle = (st) => st === 'Available' ? 'font-weight:600;border-color:#C9A66B;background:#FBF8F1' : st === 'On trip' ? 'font-weight:600;background:#F1E6CF;color:#5A4515;border-color:#C9A66B' : 'font-weight:600;background:#F6E3E1;color:#8A1F18;border-color:#E3B8B3';
const f = s.form || {};
const vehicles = s.vehicles.map((v) => {
const conf = s.confirmDel === v.id;
const facts = [v.seats ? v.seats + ' passengers' : '', v.bags ? v.bags + ' bags' : ''].filter(Boolean).join(' \u00B7 ');
return {
...v,
facts: facts || 'Add capacity details',
desc: v.desc || 'No details added yet.',
statusId: 'vs-' + v.id,
statusStyle: statusStyle(v.status),
confirming: conf,
notConfirming: !conf,
setStatus: (ev) => upd('vehicles', v.id, { status: ev.target.value }),
edit: () => { this.setState({ editing: v.id, form: { name: v.name, cat: v.cat, seats: v.seats, bags: v.bags, desc: v.desc, img: v.img }, confirmDel: '' }); setTimeout(() => { try { document.getElementById('veh-name').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (err) {} }, 60); },
askDelete: () => this.setState({ confirmDel: v.id }),
cancelDelete: () => this.setState({ confirmDel: '' }),
confirmDelete: () => this.setState({ vehicles: this.state.vehicles.filter((x) => x.id !== v.id), confirmDel: '', editing: this.state.editing === v.id ? '' : this.state.editing })
};
});
const form = { name: f.name || '', cat: f.cat || 'Sedan', seats: f.seats || '', bags: f.bags || '', desc: f.desc || '', img: f.img || '', hasImg: !!f.img, noImg: !f.img, invName: !!f.invName };
const setF = (k) => (ev) => this.setState({ form: Object.assign({}, this.state.form, { [k]: ev.target.value, invName: k === 'name' ? false : this.state.form.invName }) });

return {
tabs, stats, filters, rows, rates, extras, vehicles,
todayLabel,
eyebrow: headings[s.tab][0],
heading: headings[s.tab][1],
isBookings: s.tab === 'bookings',
isRates: s.tab === 'rates',
isFleet: s.tab === 'fleet',
isCalendar: s.tab === 'calendar',
calHead: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], calWeeks, calTitle,
calPrev: () => shiftMonth(-1), calNext: () => shiftMonth(1),
calToday: () => this.setState({ calMonth: todayStr.slice(0, 7), calSel: todayStr }),
calSummary: monthBk.length + (monthBk.length === 1 ? ' confirmed trip' : ' confirmed trips') + ' this month \u00B7 \u20B1' + monthVal.toLocaleString('en-PH'),
selTitle, selRows, selEmpty: selRows.length === 0,
isAuthed: !!s.authed, notAuthed: !s.authed,
loginUser: s.loginUser, loginPass: s.loginPass, loginErr: s.loginErr, loginInfo: s.loginInfo,
setLoginUser: (ev) => this.setState({ loginUser: ev.target.value, loginErr: '' }),
setLoginPass: (ev) => this.setState({ loginPass: ev.target.value, loginErr: '' }),
login: (ev) => { if (ev && ev.preventDefault) ev.preventDefault(); this.doLogin(); },
showSignup: () => this.doSignup(),
showForgot: () => this.setState({ loginErr: '', loginInfo: 'Password reset by email will work once the live database is connected. For now, clear this site\u2019s browser data to reset the test login.' }),
signOut: () => { try { sessionStorage.removeItem('mpgt.admin.auth'); } catch (err) {} this.setState({ authed: false, loginPass: '', loginErr: '', loginInfo: '' }); },
showDestForm: !!s.destEditing,
destForm, dests, noDests: dests.length === 0, destPageOpts,
destFormTitle: s.destEditing === 'new' ? 'Add a destination' : 'Edit destination',
destSaveLabel: s.destEditing === 'new' ? 'Add destination' : 'Save changes',
startAddDest: () => { this.setState({ destEditing: 'new', destForm: { name: '', page: '/routes/pampanga-to-metro-manila', img: '' }, destConfirm: '' }); setTimeout(() => { try { document.getElementById('dest-name').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (err) {} }, 60); },
cancelDest: () => this.setState({ destEditing: '', destForm: {} }),
setDestName: setD('name'), setDestPage: setD('page'),
pickDestPhoto: (ev) => {
const file = ev.target.files && ev.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = () => {
const img = new Image();
img.onload = () => {
let out = reader.result;
try {
const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
const c = document.createElement('canvas');
c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
const g = c.getContext('2d');
g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
out = c.toDataURL('image/jpeg', 0.82);
} catch (err) {}
this.setState({ destForm: Object.assign({}, this.state.destForm, { img: out }) });
};
img.src = reader.result;
};
reader.readAsDataURL(file);
},
saveDest: (ev) => {
if (ev && ev.preventDefault) ev.preventDefault();
const fm = this.state.destForm || {};
if (!(fm.name || '').trim()) { this.setState({ destForm: Object.assign({}, fm, { invName: true }) }); return; }
const data = { name: fm.name.trim(), page: fm.page || '/book', img: fm.img || '' };
if (this.state.destEditing === 'new') {
this.setState({ destinations: this.state.destinations.concat([Object.assign({ id: 'dest' + (uid++) }, data)]), destEditing: '', destForm: {} });
} else {
const id = this.state.destEditing;
this.setState({ destinations: this.state.destinations.map((x) => x.id === id ? Object.assign({}, x, data) : x), destEditing: '', destForm: {} });
}
},
resetData: () => { const ini = this.initial; this.setState({ rates: JSON.parse(JSON.stringify(ini.rates)), extras: JSON.parse(JSON.stringify(ini.extras)), vehicles: JSON.parse(JSON.stringify(ini.vehicles)), destinations: JSON.parse(JSON.stringify(ini.destinations)), bookings: JSON.parse(JSON.stringify(ini.bookings)), editing: '', form: {}, destEditing: '', destForm: {}, open: '', newFlash: 0 }); try { localStorage.removeItem('mpgt.inbox.v1'); } catch (err) {} },
checkInbox: () => { this.pullInbox(); this.setState({ nowTick: Date.now() }); },
clearFlash: () => this.setState({ newFlash: 0 }),
hasFlash: s.newFlash > 0, flashText: s.newFlash + (s.newFlash === 1 ? ' new request received from the website.' : ' new requests received from the website.'),
saveWarn: !!this.saveFail,

isDest: s.tab === 'destinations',
isReviews: s.tab === 'reviews',
noReviews: (s.reviews || []).length === 0,
rvStats: (() => { const rv = s.reviews || []; const ap = rv.filter((r) => r.status === 'approved'); const avg = ap.length ? (ap.reduce((a, r) => a + Number(r.rating), 0) / ap.length).toFixed(1) : '–'; const pct = ap.length ? Math.round(ap.filter((r) => r.rating >= 4).length / ap.length * 100) + '%' : '–'; return [{ label: 'Waiting for approval', value: rv.filter((r) => r.status === 'pending').length }, { label: 'Published', value: ap.length }, { label: 'Average rating', value: avg }, { label: 'Recommended', value: pct }]; })(),
reviewRows: (s.reviews || []).map((r) => {
const st = r.status || 'pending';
let d = ''; try { d = new Date(r.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (err) {}
const col = st === 'approved' ? ['#E7F1EA', '#2F7D4F'] : st === 'hidden' ? ['#ECE7DA', '#4A5D70'] : ['#FBEFD5', '#8F6B2E'];
return {
name: r.name, photo: r.photo || '', text: r.text || '(no written review)', meta: [r.trip, d].filter(Boolean).join(' · '),
stars: '★★★★★'.slice(0, Number(r.rating)) + '☆☆☆☆☆'.slice(0, 5 - Number(r.rating)), label: r.rating + ' out of 5 stars',
statusLabel: st === 'approved' ? 'Published' : st === 'hidden' ? 'Hidden' : 'Waiting for approval',
badge: 'padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:' + col[0] + ';color:' + col[1],
canApprove: st !== 'approved', canHide: st === 'approved',
removeLabel: 'Delete',
approve: () => this.setReview(r.id, 'approved'), hide: () => this.setReview(r.id, 'hidden'),
remove: () => this.removeReview(r.id)
};
}),
noRows: rows.length === 0,
noVehicles: vehicles.length === 0,
showForm: !!s.editing,
form,
formTitle: s.editing === 'new' ? 'Add a vehicle' : 'Edit vehicle',
formSaveLabel: s.editing === 'new' ? 'Add vehicle' : 'Save changes',
startAdd: () => { this.setState({ editing: 'new', form: { name: '', cat: 'Sedan', seats: '', bags: '', desc: '', img: '' }, confirmDel: '' }); setTimeout(() => { try { document.getElementById('veh-name').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (err) {} }, 60); },
cancelForm: () => this.setState({ editing: '', form: {} }),
setFormName: setF('name'), setFormCat: setF('cat'), setFormSeats: setF('seats'), setFormBags: setF('bags'), setFormDesc: setF('desc'),
pickPhoto: (ev) => {
const file = ev.target.files && ev.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = () => {
const img = new Image();
img.onload = () => {
let out = reader.result;
try {
const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
const c = document.createElement('canvas');
c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
const g = c.getContext('2d');
g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
out = c.toDataURL('image/jpeg', 0.82);
} catch (err) {}
this.setState({ form: Object.assign({}, this.state.form, { img: out }) });
};
img.src = reader.result;
};
reader.readAsDataURL(file);
},
saveVehicle: (ev) => {
if (ev && ev.preventDefault) ev.preventDefault();
const fm = this.state.form || {};
if (!(fm.name || '').trim()) { this.setState({ form: Object.assign({}, fm, { invName: true }) }); return; }
const data = { name: fm.name.trim(), cat: fm.cat || 'Sedan', seats: fm.seats || '', bags: fm.bags || '', desc: (fm.desc || '').trim(), img: fm.img || '' };
if (this.state.editing === 'new') {
this.setState({ vehicles: this.state.vehicles.concat([Object.assign({ id: 'v' + (uid++), status: 'Available' }, data)]), editing: '', form: {} });
} else {
const id = this.state.editing;
this.setState({ vehicles: this.state.vehicles.map((x) => x.id === id ? Object.assign({}, x, data) : x), editing: '', form: {} });
}
},
rateStatus: s.rateSaved ? 'Saved at ' + s.rateSaved : 'Changes save automatically in this browser',
addRate: () => this.setState({ rates: this.state.rates.concat([{ id: 'r' + (uid++), name: 'New route', sedan: '', mpv: '', van: '' }]), rateDirty: true, rateSaved: '' }),
addExtra: () => this.setState({ extras: this.state.extras.concat([{ id: 'x' + (uid++), name: 'New extra', amount: '', unit: 'per trip' }]), rateDirty: true, rateSaved: '' }),
saveRates: () => { let t = ''; try { t = new Date().toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' }); } catch (err) { t = 'now'; } this.setState({ rateDirty: false, rateSaved: t }); }
};
}
}
</script>
