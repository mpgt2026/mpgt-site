<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">



<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Payment | Manila Pampanga Go Taxi</title>
<meta name="description" content="Complete your booking payment securely.">
<meta name="theme-color" content="#102A43">
<link rel="icon" type="image/png" href="/assets/69fafbe15d88b8ca53de7f08169a767b.png">
<meta name="robots" content="noindex, nofollow">
<script src="/mpgt-sb.js"></script>
<script src="/dc.js"></script>
<script src="/i18n.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8;font-family:'Inter',system-ui,sans-serif;color:#102A43}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid #C9A66B;outline-offset:3px}
.pay-btn{transition:transform .2s ease,box-shadow .2s ease}
.pay-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(16,42,67,.28)}
@media (prefers-reduced-motion:reduce){.pay-btn{transition:none}.pay-btn:hover{transform:none}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;overflow-x:clip">
  <header style="background:#FFFFFF;padding:12px 24px;border-bottom:1px solid #C9A66B;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="/" aria-label="Manila Pampanga Go Taxi home" style="display:flex;align-items:center"><img src="/assets/69fafbe15d88b8ca53de7f08169a767b.png" alt="Manila Pampanga Go Taxi" style="height:52px;width:auto;max-width:100%"></a>
    <span style="font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8F6B2E">Secure payment</span>
  </header>

  <main style="flex:1;padding:48px 16px 64px;box-sizing:border-box">
    <div style="max-width:560px;margin:0 auto">
      <template data-sc="if" value="{{ isActive }}" hint-placeholder-val="{{ true }}">
        <section aria-label="Payment" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:3px solid #C9A66B;border-radius:4px;padding:32px 28px">
          <p style="margin:0;font-size:11.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8F6B2E">Secure payment</p>
          <h1 style="margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1">Complete your payment</h1>
          <dl style="margin:24px 0 0;display:grid;grid-template-columns:130px 1fr;gap:12px 14px;font-size:15px">
            <dt style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7C8C">Booking</dt><dd style="margin:0;font-weight:600">{{ ref }}</dd>
            <dt style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7C8C">Amount due</dt><dd style="margin:0;font-family:'Inter',system-ui,sans-serif;font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums lining-nums;color:#102A43">{{ amountText }}</dd>
          </dl>
          <div style="margin:24px 0 0;padding:14px 16px;border-radius:2px;background:#F6EBD3;border-left:3px solid #C9A66B">
            <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5A4515">Link expires in</p>
            <p style="margin:4px 0 0;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#102A43">{{ countdown }}</p>
            <p style="margin:4px 0 0;font-size:13px;color:#4A3B16">{{ expiresText }}</p>
          </div>

          <h2 style="margin:32px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px">Choose how to pay</h2>

          <div style="margin:16px 0 0;padding:20px;border:1px solid #E3DCCB;border-radius:4px;background:#FBF8F1">
            <h3 style="margin:0;font-size:16px;font-weight:700">Pay by bank transfer</h3>
            <dl style="margin:14px 0 0;display:grid;grid-template-columns:130px 1fr;gap:10px 14px;font-size:15px">
              <dt style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7C8C">Bank</dt><dd style="margin:0;font-weight:600">BDO</dd>
              <dt style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7C8C">Account name</dt><dd style="margin:0;font-weight:600">Gelyn Cabingan</dd>
              <dt style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7C8C">Account number</dt><dd style="margin:0;font-weight:600;letter-spacing:.04em;user-select:all">000030166810</dd>
            </dl>
            <figure style="margin:16px auto 0;text-align:center;max-width:260px"><img src="/assets/df12e363a1e4e9e485acae7691a23e24.png" alt="BDO InstaPay QR code" loading="lazy" style="display:block;width:100%;border:1px solid #E3DCCB;border-radius:10px;background:#FFFFFF"><figcaption style="margin-top:8px;font-size:13px;font-weight:700;color:#102A43">BDO InstaPay QR</figcaption></figure>
          </div>

          <div style="margin:14px 0 0;padding:20px;border:1px solid #E3DCCB;border-radius:4px;background:#FBF8F1">
            <h3 style="margin:0;font-size:16px;font-weight:700">Pay through GCash or Maya</h3>
            <p style="margin:8px 0 0;font-size:14px;line-height:1.55;color:#4A5D70">Scan the QR code with GCash or Maya.</p>
            <p style="margin:6px 0 0;font-size:15px"><span style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B7C8C">Account name</span> &nbsp; <strong>John Karlo Ty</strong></p>
            <div style="margin:16px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:560px;margin-left:auto;margin-right:auto">
              <template data-sc="for" list="{{ qrs }}" as="q" hint-placeholder-count="2">
                <figure style="margin:0;text-align:center"><img src="{{ q.src }}" alt="{{ q.alt }}" loading="lazy" style="display:block;width:100%;max-width:250px;margin:0 auto;border:1px solid #E3DCCB;border-radius:10px;background:#FFFFFF"><figcaption style="margin-top:8px;font-size:13px;font-weight:700;color:#102A43">{{ q.label }}</figcaption></figure>
              </template>
            </div>
          </div>

          <div style="margin:14px 0 0;padding:20px;border:1px solid #E3DCCB;border-radius:4px;background:#FBF8F1">
            <h3 style="margin:0;font-size:16px;font-weight:700">Pay with PayPal</h3>
            <a href="{{ payLink }}" target="_blank" rel="noopener" class="pay-btn" style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;min-height:52px;padding:0 24px;border-radius:2px;background:#102A43;color:#C9A66B;font-weight:700;font-size:15px">Open PayPal <span aria-hidden="true">&rarr;</span></a>
          </div>

          <div aria-disabled="true" style="margin:14px 0 0;padding:20px;border:1px dashed #D8CFBA;border-radius:4px;background:#F5F1E8;opacity:.75">
            <h3 style="margin:0;font-size:16px;font-weight:700;color:#4A5D70">Visa or Mastercard</h3>
            <p style="margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8F6B2E">Coming soon</p>
            <p style="margin:8px 0 0;font-size:13.5px;line-height:1.55;color:#4A5D70">Visa and Mastercard payments are coming soon. Please use one of the methods above for now.</p>
          </div>

          <p style="margin:22px 0 0;font-size:13.5px;line-height:1.6;color:#4A5D70">After you pay, send your receipt on WhatsApp, Viber or KakaoTalk (+63 934 598 6176) and include your booking number. We will confirm your booking once the payment is received.</p>
        </section>
      </template>

      <template data-sc="if" value="{{ isExpired }}" hint-placeholder-val="{{ false }}">
        <section role="alert" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:3px solid #8A1F18;border-radius:4px;padding:32px 28px">
          <p style="margin:0;font-size:11.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8A1F18">Link expired</p>
          <h1 style="margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1">This payment link has expired</h1>
          <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#4A5D70">For your security, payment links are valid for 24 hours. Booking {{ ref }} has not been charged. Message us and we will send you a new link.</p>
          <a href="/book" class="pay-btn" style="margin-top:24px;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:2px;background:#102A43;color:#C9A66B;font-weight:700;font-size:15px">Contact us</a>
        </section>
      </template>

      <template data-sc="if" value="{{ isInvalid }}" hint-placeholder-val="{{ false }}">
        <section role="alert" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:3px solid #C9A66B;border-radius:4px;padding:32px 28px">
          <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:36px;line-height:1.1">Payment link not found</h1>
          <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#4A5D70">Please open the full link we sent you by WhatsApp, Kakao or email. If it still does not work, message us and we will send a new one.</p>
        </section>
      </template>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { now: Date.now() };
}
componentDidMount() {
try { this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000); } catch (err) {}
}
componentWillUnmount() {
try { clearInterval(this.timer); } catch (err) {}
}
renderVals() {
const s = this.state;
let h = '';
try { h = (location.hash || '').slice(1); } catch (err) {}
const m = /^R(\d+)-(\d+)-(\d+)$/.exec(h);
const pad = (n) => (n < 10 ? '0' : '') + n;
let ref = '', amountText = '', countdown = '', expiresText = '', state = 'invalid';
if (m) {
ref = 'MPG-' + m[1];
amountText = '₱' + Number(m[2]).toLocaleString('en-US');
const exp = Number(m[3]);
const left = exp - s.now;
if (left <= 0) { state = 'expired'; } else {
state = 'active';
const t = Math.floor(left / 1000);
countdown = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60);
try { expiresText = 'Valid until ' + new Date(exp).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (err) { expiresText = ''; }
}
}
return {
isActive: state === 'active', isExpired: state === 'expired', isInvalid: state === 'invalid',
ref, amountText, countdown, expiresText,
payLink: 'https://paypal.me/mpgtaxi' + (m && Number(m[2]) > 0 ? '/' + Number(m[2]) + 'PHP' : ''),
qrs: [{ src: '/assets/44247fe0abf2fcc69c1231d6e12ef4fc.png', alt: 'GCash QR code', label: 'GCash' }, { src: '/assets/dee003d28159b4a45ff1eb0f9183c7b4.png', alt: 'Maya QR code', label: 'Maya' }]
};
}
}
</script>
</body>
</html>
