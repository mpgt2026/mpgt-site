<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">



<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebook Your Trip | Manila Pampanga Go Taxi</title>
<meta name="description" content="Choose a new date for your booking.">
<meta name="theme-color" content="#102A43">
<link rel="icon" type="image/png" href="/assets/69fafbe15d88b8ca53de7f08169a767b.png">
<meta name="robots" content="noindex, nofollow">
<script src="/dc.js"></script>
<script src="/i18n.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1E8;font-family:'Inter',system-ui,sans-serif;color:#102A43}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #C9A66B;outline-offset:3px}
.rb-fld{box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #D8CFBA;border-radius:2px;background:#FBF8F1;font:inherit;font-size:15px;color:#102A43}
.rb-fld[aria-invalid="true"]{border-color:#B3261E;background:#FDF3F2}
.rb-lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#4A5D70}
.rb-btn{transition:transform .2s ease,box-shadow .2s ease}
.rb-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(16,42,67,.28)}
@media (prefers-reduced-motion:reduce){.rb-btn{transition:none}.rb-btn:hover{transform:none}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;overflow-x:clip">
  <header style="background:#FFFFFF;padding:12px 24px;border-bottom:1px solid #C9A66B;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="/" aria-label="Manila Pampanga Go Taxi home" style="display:flex;align-items:center"><img src="/assets/69fafbe15d88b8ca53de7f08169a767b.png" alt="Manila Pampanga Go Taxi" style="height:52px;width:auto;max-width:100%"></a>
    <span style="font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8F6B2E">Rebooking</span>
  </header>

  <main style="flex:1;padding:48px 16px 64px;box-sizing:border-box">
    <div style="max-width:560px;margin:0 auto">

      <template data-sc="if" value="{{ isForm }}" hint-placeholder-val="{{ true }}">
        <section aria-label="Rebook your trip" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:3px solid #C9A66B;border-radius:4px;padding:32px 28px">
          <p style="margin:0;font-size:11.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8F6B2E">Booking {{ ref }}</p>
          <h1 style="margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1">Choose a new date</h1>
          <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#4A5D70">We are sorry, but we could not accept your trip because <strong style="color:#102A43">{{ reasonText }}</strong>.</p>
          <div style="margin:18px 0 0;padding:14px 16px;border-radius:2px;background:#E7F1EA;border-left:3px solid #2F7D4F;font-size:14px;line-height:1.55;color:#1F3D2B">Your payment is safe with us. You do not need to book again or pay again. Pick a new date and time and your booking {{ ref }} will be moved to it.</div>

          <form onSubmit="{{ submit }}" novalidate style="margin-top:24px;display:flex;flex-direction:column;gap:16px">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px">
              <div style="display:flex;flex-direction:column;gap:6px"><label class="rb-lbl" for="rb-date">New travel date *</label><input class="rb-fld" id="rb-date" type="date" min="{{ minDate }}" value="{{ date }}" onChange="{{ setDate }}" aria-invalid="{{ invDate }}"></div>
              <div style="display:flex;flex-direction:column;gap:6px"><label class="rb-lbl" for="rb-time">Pickup time *</label><input class="rb-fld" id="rb-time" type="time" value="{{ time }}" onChange="{{ setTime }}" aria-invalid="{{ invTime }}"></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px"><label class="rb-lbl" for="rb-note">Note (optional)</label><textarea class="rb-fld" id="rb-note" rows="3" placeholder="Anything we should know about the new date." value="{{ note }}" onChange="{{ setNote }}" style="padding:12px 14px;resize:vertical"></textarea></div>
            <template data-sc="if" value="{{ err }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin:0;font-size:14px;color:#B3261E">{{ err }}</p></template>
            <button type="button" onClick="{{ submit }}" class="rb-btn" style="min-height:54px;padding:0 24px;border:0;border-radius:2px;background:#102A43;color:#C9A66B;font:inherit;font-weight:700;font-size:16px;cursor:pointer">Confirm rebooking <span aria-hidden="true">&rarr;</span></button>
          </form>
        </section>
      </template>

      <template data-sc="if" value="{{ isDone }}" hint-placeholder-val="{{ false }}">
        <section role="status" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:3px solid #2F7D4F;border-radius:4px;padding:32px 28px">
          <p style="margin:0;font-size:11.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#2F7D4F">Rebooking received</p>
          <h1 style="margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1">Thank you</h1>
          <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#4A5D70">Your rebooking request for <strong style="color:#102A43">{{ ref }}</strong> is with us: <strong style="color:#102A43">{{ doneWhen }}</strong>. Your booking number stays the same and your payment is already received. We will send you the final confirmation by your chosen contact.</p>
          <a href="/" class="rb-btn" style="margin-top:24px;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:2px;background:#102A43;color:#C9A66B;font-weight:700;font-size:15px">Back to website</a>
        </section>
      </template>

      <template data-sc="if" value="{{ isInvalid }}" hint-placeholder-val="{{ false }}">
        <section role="alert" style="background:#FFFFFF;border:1px solid #E3DCCB;border-top:3px solid #C9A66B;border-radius:4px;padding:32px 28px">
          <h1 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:36px;line-height:1.1">Rebooking link not found</h1>
          <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#4A5D70">Please open the full link we sent you by WhatsApp, Kakao or email. If it still does not work, message us and we will send a new one.</p>
        </section>
      </template>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { date: '', time: '', note: '', err: '', tried: false, done: false };
}
renderVals() {
const s = this.state;
let h = '';
try { h = (location.hash || '').slice(1); } catch (err) {}
const m = /^RB(\d+)-([vdgo])$/.exec(h);
const REASONS = { v: 'the vehicle you requested is not available', d: 'we are not available on your travel date', g: 'we are not available on your date range', o: 'we are unable to accept this request as booked' };
const ref = m ? 'MPG-' + m[1] : '';
const pad = (n) => (n < 10 ? '0' : '') + n;
const t = new Date();
const minDate = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
const fmt = (d, tm) => {
let out = d;
try { const p = d.split('-'); out = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).toLocaleDateString('en-PH', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); } catch (err) {}
try { const q = tm.split(':'); const hh = Number(q[0]); out += ' at ' + ((hh % 12) || 12) + ':' + q[1] + (hh >= 12 ? ' PM' : ' AM'); } catch (err) {}
return out;
};
return {
isForm: !!m && !s.done, isDone: !!m && s.done, isInvalid: !m,
ref, reasonText: m ? REASONS[m[2]] : '',
minDate, date: s.date, time: s.time, note: s.note,
invDate: s.tried && !s.date, invTime: s.tried && !s.time,
err: s.err,
doneWhen: fmt(s.date, s.time),
setDate: (ev) => this.setState({ date: ev.target.value, err: '' }),
setTime: (ev) => this.setState({ time: ev.target.value, err: '' }),
setNote: (ev) => this.setState({ note: ev.target.value }),
submit: (ev) => {
if (ev && ev.preventDefault) ev.preventDefault();
const st = this.state;
if (!m) return;
if (!st.date || !st.time) { this.setState({ err: 'Please choose a new date and pickup time.', tried: true }); return; }
if (st.date < minDate) { this.setState({ err: 'Please choose a date that is today or later.', tried: true }); return; }
let list = [];
try { const j = JSON.parse(localStorage.getItem('mpgt.rebook.v1')); if (Array.isArray(j)) list = j; } catch (err) {}
list.push({ ref, digits: m[1], date: st.date, time: st.time, note: st.note.trim(), at: Date.now() });
try { localStorage.setItem('mpgt.rebook.v1', JSON.stringify(list)); } catch (err) {}
this.setState({ done: true, err: '' });
}
};
}
}
</script>
</body>
</html>
